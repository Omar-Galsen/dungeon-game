<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07090d" />
  <title>Dungeon Hunter</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background:
        radial-gradient(circle at 50% 18%, rgba(91, 33, 182, 0.18), transparent 34%),
        linear-gradient(180deg, #111827 0%, #07090d 55%, #020304 100%);
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .game-shell {
      width: min(100%, 1080px);
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px;
      color: #cbd5e1;
      font-size: 13px;
      letter-spacing: 0.04em;
    }

    .brand {
      color: #f5d76e;
      font-weight: 800;
      letter-spacing: 0.12em;
    }

    .game-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 10 / 7;
      border: 2px solid rgba(201, 162, 39, 0.88);
      border-radius: 16px;
      overflow: hidden;
      background: #050609;
      box-shadow:
        0 24px 70px rgba(0, 0, 0, 0.55),
        0 0 45px rgba(109, 40, 217, 0.14),
        inset 0 0 0 1px rgba(255, 255, 255, 0.04);
    }

    #game {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #game canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
    }

    .bottom-bar {
      display: flex;
      justify-content: center;
      color: #64748b;
      font-size: 12px;
    }

    @media (max-width: 700px) {
      body { padding: 8px; }
      .top-bar { font-size: 11px; }
      .game-frame { border-radius: 10px; }
      .bottom-bar { display: none; }
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <div class="top-bar">
      <span class="brand">DUNGEON HUNTER</span>
      <span>Adventure RPG</span>
    </div>

    <section class="game-frame" aria-label="Dungeon Hunter game">
      <div id="game"></div>
    </section>

    <div class="bottom-bar">WASD / Arrows to move · J to attack · X to interact</div>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
